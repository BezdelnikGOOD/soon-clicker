<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HORIZON · Кейсы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 1rem;
        }
        .app {
            background: #141a2b;
            padding: 1.5rem;
            border-radius: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 0 1px #2e3a5a;
            max-width: 800px;
            width: 100%;
            max-height: 98vh;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }
        .app::-webkit-scrollbar {
            width: 4px;
        }
        .app::-webkit-scrollbar-track {
            background: #0f1422;
            border-radius: 10px;
        }
        .app::-webkit-scrollbar-thumb {
            background: #2e3f6a;
            border-radius: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header .title-wrap {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .header .title-wrap h1 {
            color: #b7c9ff;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.3rem;
            text-shadow: 0 0 8px #3f5f9f;
            cursor: default;
        }
        .header .player-name {
            color: #7a8fc9;
            font-size: 0.8rem;
            background: #0f1422;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            border: 1px solid #2e3f6a;
        }
        .header .player-name span {
            color: #d6e5ff;
            font-weight: 600;
        }
        .tab-buttons {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #1a2645;
            border: 1px solid #2e3f6a;
            color: #8ba0dd;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            transition: 0.1s;
        }
        .tab-btn.active {
            background: #2e4a7a;
            border-color: #4f7eff;
            color: #d6e5ff;
            box-shadow: 0 0 12px #1f3b8a;
        }
        .tab-btn:active {
            transform: scale(0.94);
        }

        .tab-content {
            display: none;
            animation: fade 0.2s;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fade {
            from {
                opacity: 0.3;
            }
            to {
                opacity: 1;
            }
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            background: #0f1422;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #2e3f6a;
            margin-bottom: 1rem;
        }
        .score-block {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            color: #8ba0dd;
            font-weight: 500;
        }
        .score-num {
            color: #d6e5ff;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .per-sec {
            color: #7a8fc9;
            font-size: 0.8rem;
            background: #1a2645;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            border: 1px solid #314778;
        }

        .click-btn {
            background: radial-gradient(circle at 30% 25%, #4f7eff, #1a2d66);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            box-shadow: 0 10px 0 #0b142f, 0 8px 25px #1f3b8a;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.06s linear;
            margin: 0.2rem auto 1rem;
            display: block;
            text-shadow: 0 3px 0 #0b142f;
            letter-spacing: 2px;
            position: relative;
        }
        .click-btn:active {
            transform: scale(0.92);
            box-shadow: 0 4px 0 #0b142f;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            color: #7a8fc9;
            font-size: 0.8rem;
            background: #0f1422;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            border: 1px solid #1f2d4a;
            margin-top: 0.3rem;
        }
        .stats-row span {
            color: #d4e2ff;
            font-weight: 600;
        }

        .reset-area {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }
        .reset-btn {
            background: #3a1f2e;
            border: 1px solid #6a3148;
            color: #ffb0c8;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.08s;
            font-size: 0.8rem;
        }
        .reset-btn:active {
            transform: scale(0.94);
        }

        .footer {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.6rem;
            color: #3d4e7a;
            letter-spacing: 1px;
        }

        /* ===== КЕЙСЫ С ФОТО ===== */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .case-card {
            background: #0f1629;
            border: 2px solid #25345a;
            border-radius: 1.5rem;
            padding: 1rem;
            text-align: center;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .case-card:hover {
            transform: translateY(-4px);
            border-color: #4f7eff;
            box-shadow: 0 0 30px rgba(79, 126, 255, 0.1);
        }
        .case-card .case-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            animation: rotateGlow 10s linear infinite;
        }
        @keyframes rotateGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .case-card .case-image {
            width: 100%;
            max-width: 150px;
            height: auto;
            border-radius: 1rem;
            margin: 0 auto 0.3rem;
            display: block;
            box-shadow: 0 0 20px rgba(79, 126, 255, 0.05);
            transition: 0.2s;
            position: relative;
            z-index: 1;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #0b0e1a;
            padding: 0.2rem;
        }
        .case-card .case-image:hover {
            transform: scale(1.02);
        }
        .case-card .case-name {
            color: #d6e5ff;
            font-weight: 700;
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }
        .case-card .case-desc {
            color: #8ba0dd;
            font-size: 0.75rem;
            margin: 0.2rem 0;
            position: relative;
            z-index: 1;
        }
        .case-card .case-price {
            color: #f5c542;
            font-weight: 700;
            font-size: 1rem;
            position: relative;
            z-index: 1;
        }
        .case-card .case-btn {
            background: radial-gradient(circle at 30% 25%, #f5c542, #b38728);
            border: none;
            padding: 0.5rem 2rem;
            border-radius: 60px;
            color: #0b0e1a;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
            margin-top: 0.4rem;
            position: relative;
            z-index: 1;
        }
        .case-card .case-btn:active {
            transform: scale(0.94);
        }
        .case-card .case-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .case-card.rare {
            border-color: #4fc3ff;
        }
        .case-card.rare .case-glow {
            background: radial-gradient(circle, rgba(79, 195, 255, 0.05), transparent 70%);
        }
        .case-card.legendary {
            border-color: #f5c542;
            box-shadow: 0 0 40px rgba(245, 197, 66, 0.05);
        }
        .case-card.legendary .case-glow {
            background: radial-gradient(circle, rgba(245, 197, 66, 0.08), transparent 70%);
        }

        .case-result {
            margin-top: 0.8rem;
            padding: 0.8rem;
            border-radius: 1rem;
            background: #0b0e1a;
            border: 1px solid #25345a;
            display: none;
            animation: fadeIn 0.3s;
            text-align: center;
        }
        .case-result.show {
            display: block;
        }
        .case-result .rarity-common {
            color: #8ba0dd;
        }
        .case-result .rarity-rare {
            color: #4fc3ff;
        }
        .case-result .rarity-epic {
            color: #aa66ff;
        }
        .case-result .rarity-legendary {
            color: #f5c542;
            text-shadow: 0 0 20px rgba(245, 197, 66, 0.3);
        }
        .case-result .big-reward {
            font-size: 2rem;
            font-weight: 700;
        }

        .case-history {
            margin-top: 0.5rem;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
            background: #0b0e1a;
            border-radius: 1rem;
            padding: 0.3rem 0.5rem;
            border: 1px solid #1f2d4a;
        }
        .case-history::-webkit-scrollbar {
            width: 3px;
        }
        .case-history::-webkit-scrollbar-track {
            background: #0f1422;
            border-radius: 10px;
        }
        .case-history::-webkit-scrollbar-thumb {
            background: #2e3f6a;
            border-radius: 10px;
        }
        .case-history-item {
            color: #8ba0dd;
            font-size: 0.7rem;
            padding: 0.15rem 0;
            border-bottom: 1px solid #1a1f2a;
            display: flex;
            justify-content: space-between;
        }
        .case-history-item .item-common {
            color: #8ba0dd;
        }
        .case-history-item .item-rare {
            color: #4fc3ff;
        }
        .case-history-item .item-epic {
            color: #aa66ff;
        }
        .case-history-item .item-legendary {
            color: #f5c542;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 650px) {
            .cases-grid {
                grid-template-columns: 1fr 1fr;
            }
            .click-btn {
                width: 110px;
                height: 110px;
                font-size: 1.3rem;
            }
            .score-num {
                font-size: 1.6rem;
            }
            .header h1 {
                font-size: 1.1rem;
            }
            .tab-btn {
                font-size: 0.65rem;
                padding: 0.3rem 0.7rem;
            }
            .case-card .case-image {
                max-width: 100px;
            }
        }
        @media (max-width: 450px) {
            .cases-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="header">
            <div class="title-wrap">
                <h1>🎁 HORIZON</h1>
            </div>
            <div class="player-name">👤 <span id="playerNameDisplay">—</span></div>
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="game">🎮 Игра</button>
                <button class="tab-btn" data-tab="cases">🎁 Кейсы</button>
            </div>
        </div>

        <div class="tab-content active" id="tab-game">
            <div class="top-panel">
                <div class="score-block">
                    <span>🪙</span>
                    <span class="score-num" id="scoreDisplay">0</span>
                </div>
                <div class="per-sec" id="perSecDisplay">+0/сек</div>
            </div>
            <button class="click-btn" id="clickBtn">КЛИК</button>
            <div class="stats-row">
                <span>Всего кликов: <span id="totalClicksDisplay">0</span></span>
                <span>Сила клика: <span id="clickPowerDisplay">1</span></span>
            </div>
            <div class="reset-area">
                <button class="reset-btn" id="resetBtn">⟳ сброс прогресса</button>
            </div>
        </div>

        <!-- ===== ВКЛАДКА КЕЙСЫ ===== -->
        <div class="tab-content" id="tab-cases">
            <div class="top-panel">
                <div class="score-block">
                    <span>🪙</span>
                    <span class="score-num" id="caseScoreDisplay">0</span>
                </div>
                <div class="per-sec" id="casePerSec">+0/сек</div>
            </div>

            <div class="cases-grid" id="casesGrid">
                <!-- Кейсы создаются из JS -->
            </div>

            <div class="case-result" id="caseResult"></div>

            <div class="case-history" id="caseHistory">
                <div style="color:#5a6f9a; text-align:center; font-size:0.75rem; padding:0.3rem;">История открытий</div>
            </div>
        </div>

        <div class="footer">HORIZON · v9.2 · Кейсы с фото</div>
    </div>

    <script>
        // ============================================================
        //  КОНФИГ КЕЙСОВ (с фото)
        // ============================================================
        const CASE_TYPES = [{
            id: 'common',
            name: 'Обычный кейс',
            image: 'https://i.postimg.cc/50XVfhFf/Brawl-Box.webp',
            price: 100,
            rarity: 'common',
            rewards: [
                { type: 'coins', min: 50, max: 200, chance: 0.7 },
                { type: 'coins', min: 250, max: 500, chance: 0.3 }
            ]
        }, {
            id: 'rare',
            name: 'Редкий кейс',
            icon: '🔥',
            price: 300,
            rarity: 'rare',
            rewards: [
                { type: 'coins', min: 150, max: 500, chance: 0.6 },
                { type: 'coins', min: 600, max: 1000, chance: 0.3 },
                { type: 'upgrade', item: 'clickPower', amount: 1, chance: 0.1 }
            ]
        }, {
            id: 'legendary',
            name: 'Легендарный кейс',
            icon: '👑',
            price: 1000,
            rarity: 'legendary',
            rewards: [
                { type: 'coins', min: 500, max: 1500, chance: 0.5 },
                { type: 'coins', min: 1500, max: 3000, chance: 0.3 },
                { type: 'upgrade', item: 'clickPower', amount: 3, chance: 0.15 },
                { type: 'upgrade', item: 'autoClicker', amount: 2, chance: 0.05 }
            ]
        }];

        let state = { score: 0, totalClicks: 0, levels: {} };
        state.levels = { clickPower: 0, autoClicker: 0, passiveMulti: 0, clickMulti: 0 };

        let playerName = 'Игрок';
        let history = [];

        // ============================================================
        //  DOM
        // ============================================================
        const playerNameDisplay = document.getElementById('playerNameDisplay');
        const scoreEl = document.getElementById('scoreDisplay');
        const caseScoreEl = document.getElementById('caseScoreDisplay');
        const perSecEl = document.getElementById('perSecDisplay');
        const casePerSecEl = document.getElementById('casePerSec');
        const totalClicksEl = document.getElementById('totalClicksDisplay');
        const clickPowerEl = document.getElementById('clickPowerDisplay');
        const clickBtn = document.getElementById('clickBtn');
        const resetBtn = document.getElementById('resetBtn');
        const casesGrid = document.getElementById('casesGrid');
        const caseResult = document.getElementById('caseResult');
        const caseHistory = document.getElementById('caseHistory');

        // ============================================================
        //  ЛОГИКА КЕЙСОВ
        // ============================================================
        function openCase(caseType) {
            if (state.score < caseType.price) {
                alert(`❌ Недостаточно монет! Нужно ${caseType.price}, у вас ${Math.floor(state.score)}`);
                return;
            }

            state.score -= caseType.price;
            render();

            const rand = Math.random();
            let reward = caseType.rewards[0];
            let cumulative = 0;
            for (const r of caseType.rewards) {
                cumulative += r.chance;
                if (rand <= cumulative) {
                    reward = r;
                    break;
                }
            }

            let rewardText = '';
            let rewardClass = 'rarity-common';
            let rewardValue = 0;

            if (reward.type === 'coins') {
                const amount = Math.floor(Math.random() * (reward.max - reward.min + 1)) + reward.min;
                state.score += amount;
                rewardText = `🪙 +${amount} монет!`;
                rewardValue = amount;
                if (amount >= 1000) rewardClass = 'rarity-legendary';
                else if (amount >= 500) rewardClass = 'rarity-epic';
                else if (amount >= 200) rewardClass = 'rarity-rare';
            } else if (reward.type === 'upgrade') {
                const item = reward.item;
                const amount = reward.amount || 1;
                if (state.levels[item] !== undefined) {
                    state.levels[item] += amount;
                }
                const itemLabels = { clickPower: 'Сила клика', autoClicker: 'Автокликер', passiveMulti: 'Пассивный бонус',
                    clickMulti: 'Множитель клика' };
                rewardText = `⬆️ ${itemLabels[item] || item} +${amount}!`;
                rewardClass = 'rarity-legendary';
                rewardValue = amount;
            }

            render();

            caseResult.className = 'case-result show';
            caseResult.innerHTML = `
                <div class="big-reward ${rewardClass}">${rewardText}</div>
                <div style="font-size:0.8rem; color:#7a8fc9; margin-top:0.2rem;">${caseType.name}</div>
            `;

            history.unshift({ caseName: caseType.name, reward: rewardText, rarity: rewardClass });
            if (history.length > 20) history.pop();
            renderHistory();

            setTimeout(() => {
                caseResult.className = 'case-result';
            }, 3000);
        }

        function renderHistory() {
            if (history.length === 0) {
                caseHistory.innerHTML =
                    `<div style="color:#5a6f9a; text-align:center; font-size:0.75rem; padding:0.3rem;">История открытий</div>`;
                return;
            }
            let html = '';
            history.forEach((item) => {
                const cls = item.rarity || 'item-common';
                html += `
                    <div class="case-history-item">
                        <span class="item-name ${cls}">${item.reward}</span>
                        <span style="color:#5a6f9a;">${item.caseName}</span>
                    </div>
                `;
            });
            caseHistory.innerHTML = html;
        }

        function renderCases() {
            casesGrid.innerHTML = '';
            CASE_TYPES.forEach((caseType) => {
                const card = document.createElement('div');
                card.className = `case-card ${caseType.rarity}`;

                let imageHtml = '';
                if (caseType.image) {
                    imageHtml = `<img src="${caseType.image}" alt="${caseType.name}" class="case-image" loading="lazy">`;
                } else if (caseType.icon) {
                    imageHtml = `<div class="case-icon" style="font-size:3rem; position:relative; z-index:1;">${caseType.icon}</div>`;
                }

                card.innerHTML = `
                    <div class="case-glow"></div>
                    ${imageHtml}
                    <div class="case-name">${caseType.name}</div>
                    <div class="case-desc">💰 ${caseType.price} монет</div>
                    <div class="case-price">🎯 Шансы: ${caseType.rewards.map(r => Math.round(r.chance * 100) + '%').join(' | ')}</div>
                    <button class="case-btn" data-id="${caseType.id}">🔓 Открыть</button>
                `;
                casesGrid.appendChild(card);

                const btn = card.querySelector('.case-btn');
                btn.addEventListener('click', () => openCase(caseType));
            });
        }

        // ============================================================
        //  ИГРОВАЯ ЛОГИКА
        // ============================================================
        function computeEffects() {
            const clickBonus = 1 + (state.levels.clickPower || 0) * 1;
            const passiveIncome = (state.levels.autoClicker || 0) * 0.5;
            const passiveMult = 1 + (state.levels.passiveMulti || 0) * 0.2;
            const clickMult = 1 + (state.levels.clickMulti || 0) * 0.15;
            return {
                finalClickPower: clickBonus * clickMult,
                finalPassive: passiveIncome * passiveMult
            };
        }

        function render() {
            const eff = computeEffects();
            const score = Math.floor(state.score);
            scoreEl.textContent = score;
            caseScoreEl.textContent = score;
            perSecEl.textContent = `+${eff.finalPassive.toFixed(1)}/сек`;
            casePerSecEl.textContent = `+${eff.finalPassive.toFixed(1)}/сек`;
            totalClicksEl.textContent = state.totalClicks;
            clickPowerEl.textContent = eff.finalClickPower.toFixed(1);
            saveState();
        }

        function handleClick() {
            const eff = computeEffects();
            state.score += eff.finalClickPower;
            state.totalClicks += 1;
            render();
            clickBtn.style.transform = 'scale(0.90)';
            setTimeout(() => { clickBtn.style.transform = ''; }, 70);
        }

        // ============================================================
        //  СОХРАНЕНИЕ / ЗАГРУЗКА
        // ============================================================
        function saveState() {
            try {
                localStorage.setItem('horizonState', JSON.stringify(state));
                localStorage.setItem('horizonHistory', JSON.stringify(history));
                localStorage.setItem('horizonPlayerName', playerName);
            } catch (e) {}
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('horizonState');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (typeof parsed.score === 'number' && typeof parsed.totalClicks === 'number' && parsed.levels) {
                        state = parsed;
                    }
                }
                const histRaw = localStorage.getItem('horizonHistory');
                if (histRaw) {
                    history = JSON.parse(histRaw);
                    if (!Array.isArray(history)) history = [];
                }
                const name = localStorage.getItem('horizonPlayerName');
                if (name) playerName = name;
            } catch (e) {}
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        loadState();
        render();
        renderCases();
        renderHistory();
        playerNameDisplay.textContent = playerName;

        clickBtn.addEventListener('click', handleClick);

        resetBtn.addEventListener('click', () => {
            if (state.score === 0 && state.totalClicks === 0) return;
            if (confirm('Сбросить весь прогресс игры?')) {
                state.score = 0;
                state.totalClicks = 0;
                state.levels = { clickPower: 0, autoClicker: 0, passiveMulti: 0, clickMulti: 0 };
                history = [];
                render();
                renderHistory();
                saveState();
            }
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                const target = document.getElementById('tab-' + this.dataset.tab);
                if (target) target.classList.add('active');
                if (this.dataset.tab === 'cases') {
                    caseScoreEl.textContent = Math.floor(state.score);
                    casePerSecEl.textContent = perSecEl.textContent;
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                const activeTab = document.querySelector('.tab-content.active');
                if (activeTab && activeTab.id === 'tab-game') {
                    e.preventDefault();
                    handleClick();
                }
            }
        });

        console.log('🎁 HORIZON · Кейсы с фото загружены!');
    </script>
</body>
</html>
